[project]
name = "personal-ai-memory-os"
version = "0.6.6"
description = "A local foundation for a personal AI memory and knowledge system."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.16,<7 ; sys_platform == 'win32'",
]
desktop = [
    "pywebview>=6.0,<7 ; sys_platform == 'win32'",
]
dev = [
    "playwright>=1.55,<2",
    "pytest>=8.0,<10.0",
]

[tool.uv]
package = false
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=.cache/pytest-tmp"
