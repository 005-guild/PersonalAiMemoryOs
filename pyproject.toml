[project]
name = "personal-ai-memory-os"
version = "0.15.1"
description = "A local foundation for a personal AI memory and knowledge system."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "markdownify>=1.2,<2",
    "pillow>=13,<14",
]

[dependency-groups]
build = [
    "pyinstaller>=6.16,<7 ; sys_platform == 'win32'",
]
desktop = [
    "playwright>=1.55,<2",
    "pywebview>=6.0,<7 ; sys_platform == 'win32'",
]
dev = [
    "playwright>=1.55,<2",
    "pytest>=8.0,<10.0",
]

[tool.uv]
package = false
cache-dir = ".cache/uv"
# Security floors for transitive dependencies; these do not add runtime packages.
constraint-dependencies = [
    "certifi>=2026.10.19",
    "opentelemetry-api>=1.45.2",
    "setuptools>=84.1.0",
]
build-constraint-dependencies = ["setuptools>=84.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=.cache/pytest-tmp"
